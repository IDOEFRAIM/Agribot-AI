# Docker Compose - Cloud-Native Local Development
# Usage: docker-compose up -d

version: '3.8'

services:
  # PostgreSQL Database (peut être remplacé par RDS/Cloud SQL en prod)
  postgres:
    image: postgres:15-alpine
    container_name: agribot-postgres
    environment:
      POSTGRES_DB: agribot_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agribot-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: agribot-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - agribot-network

  # Service Database (Port 8003)
  database-service:
    build:
      context: ./services/database
      dockerfile: Dockerfile
    container_name: agribot-database
    environment:
      DATABASE_URL: "postgresql://postgres:dev_password_change_in_prod@postgres:5432/agribot_dev"
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - agribot-network
    restart: unless-stopped

  # Service Voice (Port 8002)
  voice-service:
    build:
      context: ./services/voice
      dockerfile: Dockerfile
    container_name: agribot-voice
    environment:
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY}
      AZURE_SPEECH_KEY_2: ${AZURE_SPEECH_KEY_2}
      AZURE_REGION: ${AZURE_REGION:-westeurope}
      AUDIO_RETENTION_HOURS: 24
      PRODUCTION: "false"
    ports:
      - "8002:8002"
    volumes:
      - voice_audio:/app/audio_files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - agribot-network
    restart: unless-stopped

  # Service Gateway (Port 8000)
  gateway-service:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: agribot-gateway
    environment:
      SERVICE_AI_URL: "http://ai-service:8001"
      SERVICE_VOICE_URL: "http://voice-service:8002"
      SERVICE_DATABASE_URL: "http://database-service:8003"
      HTTP_TIMEOUT: "30.0"
      AI_TIMEOUT: "120.0"
      RATE_LIMIT_PER_MINUTE: "100/minute"
    ports:
      - "8000:8000"
    depends_on:
      database-service:
        condition: service_healthy
      voice-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - agribot-network
    restart: unless-stopped

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: agribot-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - agribot-network
    restart: unless-stopped

  # Grafana (Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: agribot-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin_change_in_prod
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - agribot-network
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  voice_audio:

networks:
  agribot-network:
    driver: bridge

# Usage:
# 1. Créer .env file avec vos clés Azure
# 2. docker-compose up -d
# 3. Accéder à:
#    - Gateway: http://localhost:8000
#    - Database API: http://localhost:8003
#    - Voice API: http://localhost:8002
#    - Prometheus: http://localhost:9090
#    - Grafana: http://localhost:3000 (admin/admin_change_in_prod)
